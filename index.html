<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Un pequeño jardín para ti</title>
  <meta name="description" content="Un pequeño jardín para Lluvia.">
  <meta name="theme-color" content="#f8e4e2">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Nunito:wght@300;400;500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css?v=4">
</head>
<body class="bloqueado">

  <!-- =========================================================

      <symbol id="perro" viewBox="0 0 130 150">

        <circle cx="101.3" cy="55.5" r="1.2" fill="#fff"/>
        <ellipse cx="123" cy="68" rx="3.2" ry="2.6" fill="#241c1b"/>
        <path d="M121 74.5 q-3 3 -7 1" fill="none" stroke="#8d7a74" stroke-width="1.2" stroke-linecap="round"/>
        <ellipse cx="107" cy="73" rx="5" ry="2.8" fill="#f0a9b4" opacity=".5"/>
      </symbol>

      <!-- Gatito, mirando a la derecha -->
      <symbol id="gato" viewBox="0 0 130 150">
        <g stroke="#bb9d86" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" style="fill:var(--gato,#f2e7dd)">
          <path d="M34 134 C10 136 2 116 12 102 C16 98 20 100 18 106 C14 118 22 128 36 126 Z"/>
          <path d="M36 140 C26 118 32 92 52 84 C68 78 84 86 88 102 C92 118 92 132 88 140 Z"/>

          <path d="M28 140 C36 134 60 134 68 140 C60 145 36 145 28 140 Z"/>
          <path d="M76 140 C74 124 76 112 82 110 C88 112 90 124 88 140 Z"/>

        <path d="M84 47 v6 M90 46 v5 M78 50 v5" stroke="#d6c1b0" stroke-width="1.5" stroke-linecap="round"/>
        <ellipse class="ojo" cx="100" cy="64" rx="2.8" ry="3.6" fill="#5b4038"/>
        <circle cx="101" cy="62.6" r="1" fill="#fff"/>
        <path d="M110.5 70 h3.6 l-1.8 2.4 z" fill="#e5a3ad"/>
        <path d="M112.3 72.6 q-.8 2.6 -3.6 2.2" fill="none" stroke="#bb9d86" stroke-width="1.1" stroke-linecap="round"/>
        <path d="M114 74 l12 -2.5 M114 77 l11 2" stroke="#cdb8a8" stroke-width=".9" stroke-linecap="round"/>
        <ellipse cx="104" cy="75" rx="5" ry="2.8" fill="#f5bfc7" opacity=".7"/>
      </symbol>

      <!-- Pajarito, mirando a la derecha -->
      <symbol id="pajarito" viewBox="0 0 60 50">
        <g stroke="#bb9d86" stroke-width="1.3" stroke-linejoin="round">
          <path d="M14 30 L2 25 L4 35 Z" fill="#eebcb9"/>
          <path d="M12 30 C12 20 22 14 32 16 C38 10 48 10 52 18 C55 24 52 32 46 36 C40 42 22 44 14 38 Z" fill="#f6d5d0"/>
          <path d="M20 28 C24 22 34 22 38 28 C34 34 26 36 20 28 Z" fill="#eebcb9"/>

        <path d="M52 18.5 L58.5 21 L52 23.5 Z" fill="#e8c38e"/>

      <symbol id="petalo" viewBox="0 0 20 26">
        <path d="M10 1 C17 6 19 15 14 22 C12 25 8 25 6 22 C1 15 3 6 10 1Z" style="fill:var(--p,#f4c7cd)"/>
        <path d="M10 5 C10 11 10 16 10 21" stroke="#fff" stroke-opacity=".45" fill="none"/>
      </symbol>

      <symbol id="mariposa" viewBox="0 0 40 32">
        <path d="M20 16 C12 2 2 2 3 10 C4 16 12 17 20 16Z" style="fill:var(--m,#f3d2d8)"/>
        <path d="M20 16 C28 2 38 2 37 10 C36 16 28 17 20 16Z" style="fill:var(--m,#f3d2d8)"/>
        <path d="M20 17 C13 20 8 28 12 30 C16 31 19 24 20 17Z" style="fill:var(--m2,#ebbcc4)"/>
        <path d="M20 17 C27 20 32 28 28 30 C24 31 21 24 20 17Z" style="fill:var(--m2,#ebbcc4)"/>

      <symbol id="huella" viewBox="0 0 24 26">
        <ellipse cx="12" cy="18" rx="5.2" ry="6.4"/>
        <ellipse cx="5.5" cy="8.5" rx="2.4" ry="3.2" transform="rotate(-18 5.5 8.5)"/>
        <ellipse cx="12" cy="5" rx="2.5" ry="3.4"/>
        <ellipse cx="18.5" cy="8.5" rx="2.4" ry="3.2" transform="rotate(18 18.5 8.5)"/>

        <path d="M0 6 C5 0 14 0 20 6 C14 12 5 12 0 6Z" fill="#b5c6a5"/>

  <div class="velo" id="velo" aria-hidden="true"></div>
  <div class="efectos" id="efectos" aria-hidden="true"></div>


  <!-- ===================== 01 · PORTADA ===================== -->
  <section class="portada ambiente" id="portada">
    <div class="capa-luces" data-luces="14"></div>
    <div class="capa-petalos" data-petalos="12"></div>

    <div class="portada-contenido">
      <div id="portada-lineas"></div>
      <button class="linea boton-entrar" id="entrar" type="button" data-text="portada.boton"></button>
    </div>

    <div class="marco-tulipanes izq" data-ramo="izq"></div>
    <div class="marco-tulipanes der" data-ramo="der"></div>
    <div class="conejo conejo-portada" style="--w:clamp(92px,24vw,150px)">
      <svg viewBox="0 0 130 150"><use href="#el-flor"/></svg>
    </div>
    <div class="animalito ave portada-ave" data-animal="pajarito" style="--w:30px;left:calc(50% + 70px);bottom:30px"></div>
    <div class="pasto" data-pasto="1"></div>
  </section>

  <main class="historia">

    <!-- ===================== 02 · INTRODUCCIÓN ===================== -->
    <section class="seccion introduccion" id="introduccion">
      <div class="relato" data-relato="introduccion.relato" data-fotos="introduccion"></div>
    </section>

    <!-- ===================== 03 · CAPÍTULO I ===================== -->
    <section class="seccion comienzo" id="comienzo">
      <header class="cabecera revelar">
        <p class="capitulo" data-text="comienzo.capitulo"></p>
        <h2 class="titulo" data-text="comienzo.titulo"></h2>
      </header>
      <div class="relato" data-relato="comienzo.relato"></div>
      <div class="album" id="album">
        <svg class="enredadera" id="enredadera" aria-hidden="true"><path/><g class="hojas"></g></svg>
      </div>
      <div class="huellitas"></div>
      <div class="animalito" data-animal="gato" data-espejo style="--w:clamp(56px,15vw,78px);right:10%;bottom:60px"></div>
    </section>

    <!-- ===================== 04 · CAPÍTULO II · VERTE CRECER ===================== -->
    <section class="seccion crecer" id="crecer">
      <header class="cabecera revelar">
        <p class="capitulo" data-text="crecer.capitulo"></p>
        <h2 class="titulo" data-text="crecer.titulo"></h2>
      </header>
      <div class="relato" data-relato="crecer.antes"></div>
      <div class="linea-tiempo" id="linea-tiempo">
        <span class="tallo"></span>
        <div class="animalito ave" data-animal="pajarito" style="--w:28px;left:18px;bottom:-12px"></div>
        <div class="conejo llega" style="--w:clamp(64px,16vw,96px);left:-6px;top:-78px;--retraso:.2s">
          <svg viewBox="0 0 130 150"><use href="#ella"/></svg>
        </div>
      </div>
      <div class="relato" data-relato="crecer.despues"></div>
    </section>

    <!-- ===================== 05 · LOS DÍAS DIFÍCILES ===================== -->
    <section class="seccion dificiles" id="dificiles">
      <header class="cabecera revelar">
        <p class="capitulo" data-text="dificiles.capitulo"></p>
        <h2 class="titulo" data-text="dificiles.titulo"></h2>
      </header>
      <div class="relato lento" data-relato="dificiles.relato"></div>

      <!-- Escena: se coloca donde diga [escena] en textos.js -->
      <div class="bloque escena-dificil" id="bloque-escena">
        <svg class="tulipan-caido" viewBox="0 0 60 160" aria-hidden="true"><use href="#tulipan"/></svg>
        <div class="conejo-quieto ella"><svg viewBox="0 0 130 150"><use href="#ella"/></svg></div>
        <div class="conejo-quieto el"><svg viewBox="0 0 130 150" class="espejo"><use href="#el"/></svg></div>
      </div>
    </section>

    <!-- ===================== 06 · LO BONITO ===================== -->
    <section class="seccion bonitos" id="bonitos">
      <header class="cabecera revelar">
        <p class="capitulo" data-text="bonitos.capitulo"></p>
        <h2 class="titulo" data-text="bonitos.titulo"></h2>
      </header>
      <div class="relato" data-relato="bonitos.relato"></div>
      <div class="collage" id="collage"></div>
      <div class="animalito" data-animal="perro" style="--w:clamp(60px,17vw,86px);left:5%;bottom:34px"></div>
    </section>

    <!-- ===================== 07 · TÚ ===================== -->
    <section class="seccion tu" id="tu">
      <header class="cabecera revelar">
        <p class="capitulo" data-text="tu.capitulo"></p>
        <h2 class="titulo" data-text="tu.titulo"></h2>
      </header>
      <div class="relato" data-relato="tu.antes"></div>
      <div class="versiones" id="versiones">
        <div class="versiones-foto">
          <div class="pila" id="pila"></div>
        </div>
        <div class="versiones-lista" id="versiones-lista"></div>
      </div>
      <div class="relato" data-relato="tu.despues"></div>
    </section>

    <!-- ===================== INTERLUDIO · SU AMOR POR LOS ANIMALES ===================== -->
    <section class="seccion animales ambiente" id="animales">
      <div class="relato" data-relato="animales.relato"></div>

      <!-- Escena: se coloca donde diga [animales] en textos.js -->
      <div class="bloque escena-animales" id="bloque-animales">
        <svg class="tulipan t1" viewBox="0 0 60 160" aria-hidden="true"><use href="#tulipan"/></svg>
        <svg class="tulipan t2" viewBox="0 0 60 160" aria-hidden="true" style="--t-flor:#fbeedd;--t-osc:#ebd3b9;--t-luz:#fff8ef"><use href="#tulipan"/></svg>
        <div class="gato-escena"><svg viewBox="0 0 130 150" class="espejo"><use href="#gato"/></svg></div>
        <div class="ella-escena"><svg viewBox="0 0 130 150"><use href="#ella"/></svg></div>
        <div class="ave-escena"><svg viewBox="0 0 60 50"><use href="#pajarito"/></svg></div>
        <div class="perro-escena"><svg viewBox="0 0 130 150" class="espejo"><use href="#perro"/></svg></div>
      </div>

      <header class="cabecera revelar">
        <h2 class="titulo" data-text="animales.titulo"></h2>
      </header>
      <div class="corazon-tuyo" id="corazon-tuyo"></div>
    </section>

    <!-- ===================== 08 · LOS 7 AÑOS ===================== -->
    <section class="seccion siete ambiente" id="siete">
      <header class="cabecera revelar">
        <p class="capitulo" data-text="siete.capitulo"></p>
        <h2 class="titulo" data-text="siete.titulo"></h2>
        <p class="subtitulo" data-text="siete.intro"></p>
      </header>
      <div class="jardin-siete revelar">
        <div class="fila-siete" id="fila-siete"></div>
        <div class="animalito" data-animal="gato" data-espejo style="--w:clamp(46px,12vw,66px);right:-3%;bottom:52px;z-index:8"></div>
        <div class="pasto" data-pasto="4"></div>
      </div>
      <p class="pista" id="pista-siete" data-text="siete.pista"></p>
      <p class="contador" id="contador-siete"></p>
    </section>

    <!-- ===================== 09 · LOS 24 AÑOS ===================== -->
    <section class="seccion veinticuatro" id="veinticuatro">
      <div class="escena-24" id="escena-24">
        <p class="numero-24" id="numero-24"></p>
      </div>
      <div class="relato" data-relato="veinticuatro.relato"></div>
      <div class="macizo-24" id="macizo-24"></div>
    </section>

    <!-- ===================== 10 · GRACIAS ===================== -->
    <section class="seccion gracias" id="gracias">
      <div class="relato" data-relato="gracias.relato" data-fotos="gracias"></div>
      <div class="huellitas claras"></div>
    </section>

    <!-- ===================== 11 · EL PASTEL ===================== -->
    <section class="seccion pastel" id="pastel">
      <div class="guirnalda" id="guirnalda"></div>
      <div class="lineas-pastel" id="lineas-pastel"></div>

      <div class="pastel-escena revelar">
        <div class="conejo-quieto a-la-izq"><svg viewBox="0 0 130 150"><use href="#ella"/></svg></div>
        <button class="pastel-boton" id="soplar" type="button" aria-label="Soplar las velas">
          <svg class="pastel-svg" viewBox="0 0 300 320" aria-hidden="true">
            <defs>
              <radialGradient id="g-llama" cx=".5" cy=".75" r=".7">
                <stop offset="0" stop-color="#fffdf0"/>
                <stop offset=".45" stop-color="#ffe08f"/>
                <stop offset="1" stop-color="#f3a66a"/>
              </radialGradient>
              <radialGradient id="g-halo">
                <stop offset="0" stop-color="#ffe3a3" stop-opacity=".6"/>
                <stop offset="1" stop-color="#ffe3a3" stop-opacity="0"/>
              </radialGradient>
              <pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
                <rect width="7" height="7" fill="#fffaf3"/>
                <rect width="2.6" height="7" fill="#f2c5cb"/>
              </pattern>
            </defs>
            <ellipse cx="150" cy="300" rx="134" ry="14" fill="#d9c6b6"/>
            <ellipse cx="150" cy="295" rx="126" ry="11" fill="#fffaf3"/>
            <rect x="46" y="196" width="208" height="98" rx="12" fill="#fbeee4"/>
            <path fill="#f3c6cc" d="M46 212 V204 Q46 194 58 194 H242 Q254 194 254 204 V214 C250 222 244 222 242 214 C240 232 230 232 228 214 C224 220 218 220 214 212 C212 226 202 226 200 212 C196 218 190 218 186 212 C184 236 172 236 170 212 C166 220 160 220 156 212 C154 228 144 228 142 212 C138 218 132 218 128 212 C126 234 114 234 112 212 C108 220 102 220 98 212 C96 226 86 226 84 212 C80 218 74 218 70 212 C68 230 58 230 56 212 C52 220 48 218 46 212 Z"/>
            <g id="flores-pastel"></g>
            <rect x="80" y="120" width="140" height="80" rx="10" fill="#fffaf3"/>
            <path fill="#f6d6d9" d="M80 136 V128 Q80 118 90 118 H210 Q220 118 220 128 V138 C217 146 211 146 209 138 C207 152 197 152 195 136 C191 142 185 142 182 136 C180 156 168 156 166 136 C162 142 156 142 152 136 C150 150 140 150 138 136 C134 142 128 142 124 136 C122 154 110 154 108 136 C104 142 98 142 95 136 C93 148 85 148 83 136 Z"/>
            <g id="perlas"></g>
            <g id="velas"></g>
          </svg>
        </button>
        <div class="conejo-quieto a-la-der"><svg viewBox="0 0 130 150" class="espejo"><use href="#el"/></svg></div>
      </div>
      <p class="pista" data-text="pastel.pista"></p>
      <h2 class="felicitacion" data-text="pastel.felicitacion"></h2>
    </section>

    <!-- ===================== 12 · EL REGALO ===================== -->
    <section class="seccion regalo oculto" id="regalo">
      <p class="antes revelar" data-text="regalo.antes"></p>
      <div class="escena-regalo revelar">
        <div class="conejo llega" style="--w:clamp(76px,20vw,112px);left:-4%;bottom:0;--retraso:.8s">
          <svg viewBox="0 0 130 150"><use href="#el"/></svg>
        </div>
        <div class="animalito" data-animal="perro" data-espejo style="--w:clamp(56px,15vw,78px);right:-8%;bottom:0"></div>
        <button class="caja" id="caja" type="button" aria-label="Abrir el regalo">
          <span class="caja-cuerpo"></span>
          <span class="caja-tapa">
            <svg class="lazo" viewBox="0 0 80 44" aria-hidden="true">
              <path d="M40 30 C30 6 6 4 8 22 C10 36 30 34 40 30Z" fill="#fffaf3" stroke="#e6d3c3"/>
              <path d="M40 30 C50 6 74 4 72 22 C70 36 50 34 40 30Z" fill="#fffaf3" stroke="#e6d3c3"/>
              <circle cx="40" cy="30" r="6" fill="#fffaf3" stroke="#e6d3c3"/>
            </svg>
          </span>
          <span class="caja-etiqueta" data-text="regalo.etiqueta"></span>
        </button>
      </div>
      <p class="pista" data-text="regalo.pista"></p>

      <div class="sorpresa" id="sorpresa">
        <figure class="polaroid">
          <span class="cinta"></span>
          <div class="foto" data-foto="regalo"></div>
          <figcaption class="pie" data-text="regalo.pie"></figcaption>
        </figure>
        <p class="frase-regalo" data-text="regalo.frase"></p>
      </div>
    </section>

    <!-- ===================== 13 · LA CARTA ===================== -->
    <section class="seccion carta oculto" id="carta">
      <div class="lineas-carta" id="lineas-carta"></div>

      <div class="sobre-escena revelar" id="sobre-escena">
        <button class="sobre" id="sobre" type="button" aria-label="Abrir la carta">
          <span class="sobre-atras"></span>
          <span class="hoja-mini"></span>
          <span class="sobre-frente"></span>
          <span class="sobre-solapa"><span></span></span>
          <span class="sello"><svg viewBox="0 0 60 160" aria-hidden="true"><use href="#tulipan"/></svg></span>
          <span class="sobre-para" data-text="carta.destinatario"></span>
        </button>
        <p class="pista" id="pista-sobre" data-text="carta.pista"></p>
      </div>

      <div class="hojas-carta oculto" id="hojas-carta">
        <article class="papel" id="papel">
          <span class="cinta"></span>
          <svg class="tulipan-prensado" viewBox="0 0 60 160" aria-hidden="true"><use href="#tulipan"/></svg>
          <p class="saludo parrafo" data-text="carta.saludo"></p>
          <div id="cuerpo-carta"></div>
          <p class="despedida parrafo" data-text="carta.despedida"></p>
          <p class="firma parrafo" data-text="carta.firma"></p>
        </article>
        <article class="papel segunda" id="papel-2">
          <span class="cinta"></span>
          <div id="cuerpo-carta-2"></div>
        </article>
        <button class="doblar" id="doblar" type="button" data-text="carta.cerrar"></button>
      </div>
    </section>

    <!-- ===================== 14 · FINAL ===================== -->
    <section class="seccion final ambiente oculto" id="final">
      <div class="capa-luces" data-luces="12"></div>
      <div class="capa-petalos" data-petalos="16"></div>
      <div class="relato" data-relato="final.relato"></div>
      <div class="macizo" id="macizo-final">
        <div class="pareja">
          <div class="amigo perro-final"><svg viewBox="0 0 130 150"><use href="#perro"/></svg></div>
          <div class="conejo-final"><svg viewBox="0 0 130 150"><use href="#ella-flor"/></svg></div>
          <div class="conejo-final"><svg viewBox="0 0 130 150" class="espejo"><use href="#el"/></svg></div>
          <div class="amigo gato-final"><svg viewBox="0 0 130 150" class="espejo"><use href="#gato"/></svg></div>
          <div class="amigo ave-final"><svg viewBox="0 0 60 50"><use href="#pajarito"/></svg></div>
        </div>
        <div class="pasto" data-pasto="3"></div>
      </div>
    </section>

    <!-- ===================== 15 · EL OCTAVO TULIPÁN ===================== -->
    <section class="seccion octavo ambiente oculto" id="octavo">
      <div class="capa-luces" data-luces="16"></div>
      <div class="lineas-octavo" id="lineas-octavo"></div>

      <div class="escena-octavo">
        <div class="fila-ocho" id="fila-ocho">
          <svg class="capullo" id="capullo" viewBox="0 0 80 200" aria-hidden="true">
            <path d="M40 198 C41 160 38 122 40 84" fill="none" stroke="#9fb28f" stroke-width="3.4" stroke-linecap="round"/>
            <path d="M40 190 C22 176 15 146 19 122 C29 140 37 158 41 178 Z" fill="#b5c6a5"/>
            <path d="M40 196 C58 178 65 152 60 130 C52 148 44 164 39 184 Z" fill="#9fb28f"/>
            <g class="flor">
              <path class="p-atras" d="M28 78 C22 58 30 36 40 28 C50 36 58 58 52 78 C47 84 33 84 28 78Z" fill="#e7aab4"/>
              <path class="p-izq" d="M40 84 C28 84 20 72 20 54 C20 44 26 34 32 30 C34 46 38 64 40 84Z" fill="#f3c3ca"/>
              <path class="p-der" d="M40 84 C52 84 60 72 60 54 C60 44 54 34 48 30 C46 46 42 64 40 84Z" fill="#f3c3ca"/>
              <path class="p-centro" d="M32 72 C31 52 35 38 40 30 C45 38 49 52 48 72 C45 80 35 80 32 72Z" fill="#fbe1e4"/>
            </g>
          </svg>
        </div>
        <div class="ave-octavo" id="ave-octavo"><svg viewBox="0 0 60 50" class="espejo"><use href="#pajarito"/></svg></div>
        <div class="pareja-pequena">
          <div><svg viewBox="0 0 130 150"><use href="#ella"/></svg></div>
          <div><svg viewBox="0 0 130 150"><use href="#el"/></svg></div>
        </div>
        <div class="pasto" data-pasto="5"></div>
      </div>

      <h2 class="te-amo-final" id="te-amo-final" data-text="octavo.final"></h2>
      <button class="volver" id="volver" type="button" data-text="octavo.volver"></button>
    </section>
  </main>

  <!-- ===================== VISOR DE RECUERDOS ===================== -->
  <div class="visor" id="visor" role="dialog" aria-modal="true" aria-labelledby="visor-titulo" hidden>
    <div class="visor-fondo" data-cerrar></div>
    <div class="visor-contenido">
      <figure class="polaroid visor-polaroid" id="visor-polaroid">
        <div class="carrusel" id="carrusel"><div class="pista-fotos" id="pista-fotos"></div></div>
        <button class="flecha anterior" type="button" aria-label="Foto anterior">‹</button>
        <button class="flecha siguiente" type="button" aria-label="Foto siguiente">›</button>
        <div class="puntos" id="puntos"></div>
      </figure>
      <div class="visor-texto">
        <p class="visor-sobre"></p>
        <h3 id="visor-titulo"></h3>
        <p class="visor-detalle"></p>
        <button class="visor-cerrar" type="button" data-cerrar>guardar este recuerdo</button>
      </div>
    </div>
  </div>

  <div class="aviso" id="aviso" role="status"></div>

  <script src="js/textos.js?v=4"></script>
  <script src="js/fotos.js?v=4"></script>
  <script src="js/jardin.js?v=4"></script>
</body>
</html>
